# To activate: copy to .github/workflows/ci.yml using a connection with workflows permission.
name: Java verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-h2
          path: target/surefire-reports/
  planning-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prdv_test
          MYSQL_USER: prdv
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify planning persistence and cross-practitioner concurrency on MySQL
        run: >-
          mvn -B --no-transfer-progress -Dtest=JpaAgendaStoreTest
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/prdv_test
          -Dspring.datasource.username=prdv
          -Dspring.datasource.password=ci-only-password
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          -Dspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
          test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-mysql
          path: target/surefire-reports/
