# Profil local SANS Docker : base H2 en memoire (mode MySQL), donnees de demo chargees.
spring:
  datasource:
    url: jdbc:h2:mem:prdv;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

prdv:
  seed: true
