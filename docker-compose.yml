# Base de donnees MySQL du module 1
# Demarrage : docker compose up -d
# Si un MySQL natif est deja actif sur la machine (port 3306 occupe),
# demarrer sur un autre port hote : DB_PORT=13306 docker compose up -d
# et lancer l'application avec la meme variable (DB_PORT=13306).
#
# Alternative sans Docker (dev rapide) : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Voir docs/TROUBLESHOOTING.md si vous obtenez "Communications link failure / Connexion refusee".
services:
  mysql:
    image: mysql:8.4
    container_name: prdv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: prdv
      MYSQL_USER: ${DB_USER:-prdv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - prdv-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Interface web optionnelle pour visualiser la base : http://localhost:8081
  adminer:
    image: adminer:4.8.1
    container_name: prdv-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  prdv-mysql-data:
