version: "3.9"

# Base de donnees MySQL du module 1
# Demarrage : docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: prdv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: prdv
      MYSQL_USER: ${DB_USER:-prdv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - prdv-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Interface web optionnelle pour visualiser la base : http://localhost:8081
  adminer:
    image: adminer:4.8.1
    container_name: prdv-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  prdv-mysql-data:
