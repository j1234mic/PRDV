name: CI

on:
  push:
    branches-ignore:
      - ci-results
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Build & tests (unites, integration, bout en bout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        id: build
        run: |
          mkdir -p target
          set +e
          mvn -B --no-transfer-progress verify > target/build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 150 target/build.log

      - name: Publish test report branch
        if: always()
        run: |
          mkdir -p run
          cp -r target/surefire-reports run/ 2>/dev/null || true
          cp -r target/failsafe-reports run/ 2>/dev/null || true
          cp target/build.log run/build.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results-tmp
          git rm -rf --quiet . || true
          git add -f run
          git commit -m "CI report run ${{ github.run_id }} (${{ github.sha }})"
          git push --force origin HEAD:ci-results

      - name: Fail the job if the build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
