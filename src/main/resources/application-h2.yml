# Profil "h2" : base embarquée pour développement sans Docker
# Activation explicite : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# (Par défaut, application.yml utilise déjà H2, ce fichier permet de forcer le profil)
spring:
  datasource:
    url: jdbc:h2:file:./data/prdv;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  docker:
    compose:
      enabled: false
