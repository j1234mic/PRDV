# Profil "h2" : base en memoire pour developpement sans Docker/MySQL.
# Usage : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ou :   SPRING_PROFILES_ACTIVE=h2 ./mvnw spring-boot:run
# (Par defaut, application.yml utilise deja H2 fichier, ce profil force H2 memoire)
spring:
  datasource:
    url: jdbc:h2:mem:prdv;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  docker:
    compose:
      enabled: false

logging:
  level:
    com.prdv.rdv: INFO
