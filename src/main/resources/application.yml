server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: prdv-rdv
  # ---------------------------------------------------------------------------
  # Par defaut : H2 embarquee (fichier ./data/prdv) pour permettre un demarrage
  # sans Docker. Pour utiliser MySQL, activer le profil "mysql" :
  #   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
  # ou via variable d'environnement : SPRING_PROFILES_ACTIVE=mysql
  # Le profil mysql demarre aussi automatiquement le conteneur MySQL si
  # spring-boot-docker-compose est present et que Docker est disponible.
  #
  # Alternatives sans Docker (memoire) :
  #   mvn spring-boot:run -Dspring-boot.run.profiles=h2      (H2 memoire)
  #   mvn spring-boot:run -Dspring-boot.run.profiles=dev     (H2 memoire + logs SQL)
  #
  # ATTENTION : H2 2.x REFUSE la combinaison AUTO_SERVER=TRUE + DB_CLOSE_ON_EXIT=FALSE
  # dans l'URL JDBC et echoue au demarrage avec :
  #   Feature not supported: "AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE" [50100 / HYC00]
  # (le mode mixed/auto-server exige que H2 puisse poser son shutdown hook).
  # La console H2 integree (/h2-console) fonctionne sans AUTO_SERVER : elle tourne
  # dans le meme JVM que l'application et se rattache a la base deja ouverte.
  # Pour ouvrir ./data/prdv.mv.db depuis un OUTIL EXTERNE (DBeaver, IntelliJ...) pendant
  # que l'application tourne, utiliser le mixed mode SANS DB_CLOSE_ON_EXIT=FALSE :
  #   SPRING_DATASOURCE_URL='jdbc:h2:file:./data/prdv;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE' mvn spring-boot:run
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:file:./data/prdv;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # H2 par defaut ; MySQL auto-detecte ou explicite dans application-mysql.yml
        # L'ancien MySQLDialect explicite dans le profil par defaut cassait H2 (HHH90000025)
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  sql:
    init:
      mode: always
  # Docker Compose : active seulement avec le profil mysql (voir application-mysql.yml)
  docker:
    compose:
      enabled: false
  # Notification email (optionnel) : si les variables MAIL_HOST / MAIL_USERNAME /
  # MAIL_PASSWORD sont fournies via les variables d'environnement, configurez
  # spring.mail.host, spring.mail.port (587), spring.mail.username, spring.mail.password.
  # Sans SMTP, les OTP sont affiches dans les logs de l'application.

# ---------------------------------------------------------------------------
# Configuration metier du module IAM
# ---------------------------------------------------------------------------
prdv:
  security:
    jwt:
      # 64 caracteres en dev ; en production passer par la variable JWT_SECRET
      secret: ${JWT_SECRET:dev-only-secret-please-override-0123456789abcdefghijklmnop}
      access-token-ttl-seconds: 900       # 15 minutes
      challenge-token-ttl-seconds: 300    # 5 minutes (MFA / OTP etape 2)
    refresh:
      token-ttl-days: 14
    login:
      max-failed-attempts: 5
      lock-duration-minutes: 15
    otp:
      ttl-seconds: 300
      resend-cooldown-seconds: 60
    cipher:
      # Cle de chiffrement AES-GCM (une empreinte SHA-256 est derivee de cette valeur)
      secret: ${CIPHER_SECRET:dev-cipher-secret-change-me-0123456789}
    rate-limit:
      login-attempts-per-minute: 10
      otp-per-minute: 5
  storage:
    local-path: ${STORAGE_PATH:./storage/kyc}
  admin:
    email: ${ADMIN_EMAIL:superadmin@prdv.app}
    password: ${ADMIN_PASSWORD:Admin#2026!}
    first-name: Super
    last-name: Administrator
  frontend:
    oauth-redirect-url: ${FRONTEND_OAUTH_URL:http://localhost:3000/auth/callback}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.prdv.rdv: INFO
    org.springframework.security: WARN
