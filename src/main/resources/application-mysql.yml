# Profil "mysql" : utilise MySQL 8 (Docker ou natif)
# Activation : mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ou : SPRING_PROFILES_ACTIVE=mysql mvn spring-boot:run
# Si Docker est disponible, le conteneur MySQL défini dans docker-compose.yml
# démarre automatiquement grâce à spring-boot-docker-compose.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prdv}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
  docker:
    compose:
      enabled: true
      # Fichier compose à la racine du projet
      file: ./docker-compose.yml
      # Service à démarrer (mysql)
      # lifecycle-management: start_and_stop est le défaut
      lifecycle-management: start_and_stop
      # Démarrage seulement si le profil mysql est actif
      # (déjà garanti par le nom du fichier application-mysql.yml)
