spring:
  datasource:
    url: jdbc:h2:mem:prdv-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  # Les tests ne doivent jamais demarrer de conteneurs (docker-compose.yml a
  # la racine du module ne doit pas declencher Docker Compose en @SpringBootTest)
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 30MB

prdv:
  security:
    jwt:
      secret: test-only-secret-please-override-0123456789abcdefghijklmnop-test
    cipher:
      secret: test-cipher-secret-change-me-0123456789-test
  storage:
    local-path: ./storage/kyc-test
  profile:
    storage:
      # Fichiers medicaux des tests : ephemeres (repertoire de build)
      local-path: ./target/test-storage/profile
